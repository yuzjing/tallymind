name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main # 当向 main 分支 push 代码时自动触发构建

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 赋予上传镜像到 GHCR 的权限

    steps:
      # 1. 拉取代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 设置 Docker Buildx (支持高效缓存)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 登录 GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # 使用内置的 GITHUB_TOKEN，无需手动配置

      # 4. 自动编译并推送到 GHCR
      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: 自动清理 GHCR 历史旧版本镜像 (保留最近 5 个)
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'tallymind'
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: 'true' # 优先清理无 tag 的中间层
