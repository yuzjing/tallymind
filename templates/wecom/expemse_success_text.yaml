msgtype: "text"
text:
  content: {{ if .IsSingle }}
    {{ printf "🌿 记账成功\n──────────────\n金额：￥%.2f (%s)\n项目：%s\n日期：%s\n──────────────\n🔗 <a href=\"%s\">查看账单明细 ›</a>" .FirstItem.Amount .PrimaryCategory .PrimaryName .FirstItem.Date .JumpURL | quote }}
  {{ else }}
    {{ printf "🌿 记账成功 (共 %d 笔)\n──────────────\n合计：￥%.2f\n──────────────\n🔗 <a href=\"%s\">查看账单明细 ›</a>" .Count .TotalAmount .JumpURL | quote }}
  {{ end }}