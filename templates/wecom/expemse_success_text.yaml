# templates/wecom/expense_success.yaml
msgtype: "text"
text:
  content: |
    {{- if eq .PrimaryCategory "资产对账" }}
      {{- if .IsSingle }}
    👌 资产对账与断言已记录
    ──────────────
    账户：{{ .FirstItem.Account }}
    当前余额：￥{{ printf "%.2f" .FirstItem.Amount }} {{ .FirstItem.Currency }}
    ──────────────
    (Beancount 数学核对完成)
      {{- else }}
    👌 资产对账已记录 (共 {{ .Count }} 处)
    ──────────────
    {{- range .Items }}
    • {{ .Account }}: ￥{{ printf "%.2f" .Amount }} {{ .Currency }}
    {{- end }}
    ──────────────
    (Beancount 数学核对完成)
      {{- end }}
      {{- if .JumpURL }}
    🔗 <a href="{{ .JumpURL }}">查看资产大盘 ›</a>
      {{- end }}
    {{- else if .IsSingle }}
    🌿 记账成功
    ──────────────
    金额：￥{{ printf "%.2f" .FirstItem.Amount }} ({{ .PrimaryCategory }})
    项目：{{ .PrimaryName }}
    日期：{{ .FirstItem.Date }}
      {{- if .JumpURL }}
    ──────────────
    🔗 <a href="{{ .JumpURL }}">查看账单明细 ›</a>
      {{- end }}
    {{- else }}
    🌿 记账成功 (共 {{ .Count }} 笔)
    ──────────────
    合计：￥{{ printf "%.2f" .TotalAmount }}
      {{- if .JumpURL }}
    ──────────────
    🔗 <a href="{{ .JumpURL }}">查看账单明细 ›</a>
      {{- end }}
    {{- end }}