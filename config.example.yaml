# ==========================================
# 1. 基础应用与服务配置
# ==========================================
app:
  env: "production"                # 运行环境: development / production                    # 开启调试模式将强制输出全量 debug 日志
  log_level: "debug"                # debug / info / warn / error
  log_dir: "/app/logs"             # 日志持久化输出目录
  port: "8080"                     # 监听端口
  public_url: "https://tallymind.example.com" # 外部公网访问域名
  template_dir: "templates"        # 模板根目录
  receipt_template: ""
  receipt_sign_secret: ""          # 小票 2 小时验签私钥 
  report_template: ""
  panel_url: "http://panel:5000"  # 看板后端容器地址 (留空自动关闭反代)
  panel_path: "/panel"                # 动态挂载前缀 (如 /panel 或 /view)

  # 功能开关
  enable_http_api: true            # 是否开启通用 HTTP API
  enable_wecom_http: true          # 是否开启企微自建应用 HTTP 回调
  enable_wecom_wss: false          # 是否开启企微 WSS 机器人长连接
  enable_llm: true                 # 是否开启 AI 智能大模型记账
  enable_git_backup: false         # 是否开启 Git 定时自动备份
  git_backup_cron: "0 */6 * * *"   # 备份定时表达式
  enable_reporter: false           # 是否开启定时报表

  # 通知渠道
  report_channels: ["wecom"]
  alert_channels: ["wecom"]

# ==========================================
# 2. 多服务商大模型配置 (支持跨平台故障转移与多 Key 轮询)
# ==========================================
llm:
  max_tokens: 4096
  temperature: 0.2
  top_p: 0.0
  frequency_penalty: 0.0
  presence_penalty: 0.0
  providers:
    # 🌟 主力：Google Gemini 2.5 Flash
    - base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
      model: "gemini-2.5-flash"
      api_key: "AQ.GeminiKey1_Account1..."

    # 🌟 备用：第二个 Gemini 账号 Key (用于并发限流容灾)
    - base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
      model: "gemini-2.5-flash"
      api_key: "AQ.GeminiKey2_Account2..."

    # 🌟 备用：DeepSeek 官方 API (可选)
    # - base_url: "https://api.deepseek.com"
    #   model: "deepseek-chat"
    #   api_key: "sk-DeepSeekKey..."

# ==========================================
# 3. 企业微信自建应用配置
# ==========================================
wecom:
  corp_id: "ww_your_corpid"
  agent_id: 1000002
  secret: "your_app_secret"
  token: "your_callback_token"
  encoding_aes_key: "your_43_chars_encoding_aes_key"
  success_template: "wecom/expense_success.yaml"
  failure_template: "wecom/expense_fail.yaml"
  report_template: "wecom/report.yaml"

  # WSS 机器人 (可选)
  bot_id: ""
  bot_secret: ""

# ==========================================
# 4. Beancount 复式记账配置
# ==========================================
ledger:
  file_path: "data/2026.bean"
  default_currency: "CNY"
  default_reporter: "User"
  fallback_category: "Expenses:Uncategorized"
  fallback_account: "Assets:Pending:Unknown"
  fallback_payee: "日常消费"

  # 🌟 成员与别名词典 (支持多别名、拼音缩写映射)
  members:
    husband: ["user", "老公","先生", "丈夫"]
    